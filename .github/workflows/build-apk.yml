name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (apk.zip)
        run: |
          rm -rf proj && mkdir proj
          unzip -q apk.zip -d proj
          S=$(find proj -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          if [ -z "$S" ]; then echo "settings.gradle not found inside apk.zip"; exit 1; fi
          echo "PROJ_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK روی ubuntu-latest از قبل نصب است؛ فقط لایسنس‌ها را تایید می‌کنیم (خطا نمی‌دهد)
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AzadChat-APK
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
